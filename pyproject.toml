[project]
name = "template-repository-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bandit>=1.9.4",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
    "uv>=0.11.29",
]

[tool.ruff]
lint.select = [
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle warnings
    "D", # pydocstyle
]
lint.ignore = []
lint.extend-ignore = [
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # undocumented-magic-method
    "D107", # undocumented-public-init
    "D205", # blank-line-after-summary
    "D415", # ends-in-punctuation
    "E501" # Line too long
]
lint.exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".nox",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ty.environment]
python-version = "3.14"

[tool.ty.analysis]
# 型スタブが提供されていない/不完全なサードパーティライブラリはunresolved-importを許容する
allowed-unresolved-imports = [
    "lightgbm",
    "optuna",
    "polars",
    "psutil",
    "pytz",
    "requests",
    "requests.*",
    "tensorflow",
    "torch",
    "transformers",
    "xgboost",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
