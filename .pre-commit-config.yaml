repos:
  #############################################################################
  # pre-commit built-in hooks (security & hygiene)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
  #############################################################################
  # isort
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b1
    hooks:
      - id: isort
        name: isort
        description: "Run 'isort' to sort Python imports"
  #############################################################################
  # Ruff (format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-format
        name: ruff-format
        description: "Run 'ruff format' for extremely fast Python formatting"
        entry: ruff format --force-exclude
        language: python
        types_or: [python, pyi]
        args: []
        require_serial: true
        additional_dependencies: []
        minimum_pre_commit_version: "2.9.2"
  #############################################################################
  # # ty
  # - repo: https://github.com/astral-sh/ty-pre-commit
  #   rev: v0.0.61
  #   hooks:
  #     - id: ty
  #       name: ty
  #       description: "Run 'ty' for extremely fast Python type checking"
  #############################################################################
  # bandit
  - repo: https://github.com/PyCQA/bandit
    rev: "1.9.4"
    hooks:
      - id: bandit
        name: bandit
        description: "Run 'bandit' to find common security issues in Python code"
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
  #############################################################################
  # pip-audit (dependency vulnerability audit)
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        description: "Audit Python dependencies for known vulnerabilities"
        entry: uv run pip-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
  #############################################################################
